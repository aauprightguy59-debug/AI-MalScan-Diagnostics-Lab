services:
  - type: web
    name: ai-malscan-diagnostics-lab
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: aimalscan-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1